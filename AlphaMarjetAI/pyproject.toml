[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphamarketai"
version = "0.2.0"
description = "Research-first probabilistic relational market forecasting toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "torch>=2.2,<3"]

[tool.setuptools.packages.find]
include = ["alphamarketai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
